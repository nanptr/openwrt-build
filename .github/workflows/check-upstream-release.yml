name: Check OpenWrt Stable Release

on:
  schedule:
    - cron: '17 0 */2 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: check-upstream-release
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Fetch latest stable release
      run: |
        latest="$(curl -fsSL 'https://api.github.com/repos/openwrt/openwrt/tags?per_page=100' \
          | grep -oE '"name": "v25\.12\.[0-9]+"' \
          | grep -oE '25\.12\.[0-9]+' \
          | sort -t. -k3 -n \
          | tail -1)"
        current="$(tr -d '\n' < openwrt-version.txt)"
        echo "LATEST_VERSION=${latest}" >> "$GITHUB_ENV"
        echo "CURRENT_VERSION=${current}" >> "$GITHUB_ENV"
        if [ -z "${latest}" ]; then
          echo "Failed to detect the current OpenWrt stable release."
          exit 1
        fi
        if [ "${latest}" = "${current}" ]; then
          echo "No update detected."
          exit 0
        fi
        echo "${latest}" > openwrt-version.txt

    - name: Commit updated version
      run: |
        if [ "${LATEST_VERSION}" = "${CURRENT_VERSION}" ]; then
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add openwrt-version.txt
        git commit -m "Update OpenWrt to ${LATEST_VERSION}"
        git push

    - name: Trigger firmware build
      if: env.LATEST_VERSION != env.CURRENT_VERSION
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run build-openwrt.yml --ref main
