name: Build OpenWrt NanoPi R6C

on:
  push:
    branches:
      - main
    paths:
      - openwrt-version.txt
      - openwrt-revision.txt
      - configs/openwrt-nanopi-r6c.config
      - files/**
      - .github/workflows/build-openwrt.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      source_revision: ${{ steps.source-meta.outputs.source_revision }}
      source_revision_short: ${{ steps.source-meta.outputs.source_revision_short }}
      ota_version: ${{ steps.ota-version.outputs.ota_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: NanoPi R6C
            artifact_name: firmware-nanopi-r6c
            config_file: configs/openwrt-nanopi-r6c.config
            custom_files_dir: files
            repo_url: https://github.com/openwrt/openwrt
            version_file: openwrt-version.txt
            source_name: OpenWrt
            extra_feeds: "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git"

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CONFIG_FILE: ${{ matrix.config_file }}
      TZ: Asia/Shanghai

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Load Source Version
      run: |
        echo "SOURCE_VERSION=$(tr -d '\n' < '${{ matrix.version_file }}')" >> "$GITHUB_ENV"

    - name: Select source branch
      run: |
        case "${SOURCE_VERSION}" in
          25.*)
            branch="openwrt-25.12"
            ;;
          *)
            echo "Unsupported source version series: ${SOURCE_VERSION}"
            echo "This repository currently tracks only the openwrt-25.12 release series."
            exit 1
            ;;
        esac
        echo "REPO_BRANCH=${branch}" >> "$GITHUB_ENV"
        echo "Using ${{ matrix.source_name }} source branch ${branch}"

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
          gettext gcc-multilib g++-multilib gnutls-dev gperf haveged help2man intltool \
          lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$USER" /workdir

    - name: Clone Source Tree
      working-directory: /workdir
      run: |
        git clone --filter=blob:none --single-branch -b "$REPO_BRANCH" "${{ matrix.repo_url }}" openwrt
        cd openwrt
        echo "Building branch ${REPO_BRANCH} at $(git rev-parse HEAD)"
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Detect source revision
      id: source-meta
      run: |
        cd openwrt
        source_revision="$(./scripts/getver.sh)"
        source_revision_short="${source_revision%%-*}"
        echo "source_revision=${source_revision}" >> "$GITHUB_OUTPUT"
        echo "source_revision_short=${source_revision_short}" >> "$GITHUB_OUTPUT"

    - name: Set OTA version
      id: ota-version
      run: |
        ota_version="${SOURCE_VERSION}-r${GITHUB_RUN_NUMBER}"
        echo "ota_version=${ota_version}" >> "$GITHUB_OUTPUT"
        mkdir -p files/etc
        printf '%s\n' "${ota_version}" > files/etc/ota_version

    - name: Configure feeds
      run: |
        cd openwrt
        if [ -n "${{ matrix.extra_feeds }}" ]; then
          printf '%s\n' "${{ matrix.extra_feeds }}" >> feeds.conf.default
        fi
    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Add third-party package sources
      run: |
        cd openwrt
        # zerotier (sbwml fork)
        rm -rf feeds/packages/net/zerotier
        git clone --depth=1 https://github.com/sbwml/feeds_packages_net_zerotier feeds/packages/net/zerotier

        # luci-app-zerotier (not in official LuCI feed; sparse checkout from ImmortalWrt)
        # ../../luci.mk resolves to package/luci.mk, so keep it at package/ root
        rm -rf package/new/iwrt-luci package/new/luci-app-zerotier package/luci.mk
        git clone --depth=1 --filter=blob:none --sparse https://github.com/immortalwrt/luci package/new/iwrt-luci
        git -C package/new/iwrt-luci sparse-checkout set --skip-checks applications/luci-app-zerotier luci.mk
        mv package/new/iwrt-luci/applications/luci-app-zerotier package/new/luci-app-zerotier
        mv package/new/iwrt-luci/luci.mk package/luci.mk
        rm -rf package/new/iwrt-luci

        # luci-app-diskman (not in official LuCI feed)
        rm -rf package/new/diskman
        git clone --depth=1 https://github.com/sbwml/luci-app-diskman package/new/diskman

        # luci-app-ota
        rm -rf package/new/ota-feed package/new/luci-app-ota
        git clone --depth=1 https://github.com/breeze303/luci-app-ota package/new/ota-feed
        mv package/new/ota-feed/luci-app-ota package/new/luci-app-ota
        rm -rf package/new/ota-feed

    - name: Load custom files and config
      run: |
        if [ -d "${{ matrix.custom_files_dir }}" ]; then
          mkdir -p openwrt/files
          cp -a "${{ matrix.custom_files_dir }}"/. openwrt/files/
        fi
        cp "$CONFIG_FILE" openwrt/.config
        cd openwrt
        unset FILES FILES_DIR
        make defconfig
        grep -E 'CONFIG_TARGET_|CONFIG_PACKAGE_(dockerd|docker|docker-compose|nginx-ssl|luci-nginx|nikki|luci-app-zerotier|luci-app-nikki)|CONFIG_LUCI_LANG_zh_Hans|CONFIG_KERNEL_CGROUP_DEVICE|CONFIG_DOCKER_CGROUP_OPTIONS' .config

    - name: Download packages
      run: |
        cd openwrt
        unset FILES FILES_DIR
        make download -j"$(nproc)"
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      id: build
      run: |
        cd openwrt
        unset FILES FILES_DIR
        make -j"$(nproc)" || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"
        manifest="$(find bin/targets -name '*.manifest' | head -n 1)"
        if [ -n "$manifest" ]; then
          kernelv="$(grep '^kernel - ' "$manifest" | awk '{print $3}' | head -n 1 || true)"
          [ -n "$kernelv" ] && echo "kernel_version=$kernelv" >> "$GITHUB_OUTPUT"
        fi

    - name: Organize firmware
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ env.FIRMWARE }}/*
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Load OpenWrt version
      run: |
        echo "OWRT_VERSION=$(tr -d '\n' < openwrt-version.txt)" >> "$GITHUB_ENV"

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: firmware-nanopi-r6c
        path: release-assets

    - name: Normalize release asset names
      env:
        RELEASE_DEVICE: nanopi-r6c
      run: |
        mkdir -p release-bundle
        copied=0
        for file in release-assets/*; do
          [ -f "$file" ] || continue
          base="$(basename "$file")"
          case "$base" in
            # 只发布固件镜像和校验文件，跳过日志 / 构建信息 / 描述文件
            *.img.gz|*sha256sums*) ;;
            *.log|*.buildinfo|*.manifest|profiles.json) continue ;;
            *) continue ;;
          esac
          cp "$file" "release-bundle/${RELEASE_DEVICE}-${base}"
          copied=1
        done
        if [ "$copied" -eq 0 ]; then
          echo "No firmware files found in release-assets."
          exit 1
        fi

    - name: Generate release notes
      run: |
        {
          echo "OpenWrt NanoPi R6C"
          echo
          echo "Version: ${OWRT_VERSION}"
          echo
          echo "Devices:"
          echo "- NanoPi R6C: 192.168.10.1"
          echo
          echo "Build mode: full source build"
          echo "Docker cgroup options: enabled"
          echo "Nginx: included"
        } > release.txt

    - name: Generate OTA metadata
      env:
        OTA_VERSION_KEY: ${{ needs.build.outputs.ota_version }}
        OTA_RELEASES_URL: https://github.com/${{ github.repository }}/releases
        OTA_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/latest/download
      run: |
        sysupgrade="$(find release-bundle -maxdepth 1 -type f -name 'nanopi-r6c-*squashfs-sysupgrade*.img.gz' | head -n 1)"
        if [ -z "$sysupgrade" ]; then
          echo "Unable to locate NanoPi R6C sysupgrade image in release-bundle."
          exit 1
        fi
        sysupgrade_name="$(basename "$sysupgrade")"
        sha256="$(sha256sum "$sysupgrade" | awk '{print $1}')"
        build_date="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

        printf '[%s](%s)\nSHA256: %s\nBuild date: %s\n' \
          "${OTA_VERSION_KEY}" "${sysupgrade_name}" "${sha256}" "${build_date}" \
          > release-bundle/version.latest

        printf '%s\n' "${OTA_VERSION_KEY}" > release-bundle/version.index

        printf '%s\n' \
          "<br><a href=\"${OTA_RELEASES_URL}\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Releases</a>" \
          > release-bundle/ota.footer.html

        printf '%s\n' \
          '{' \
          '  "friendlyarm,nanopi-r6c": [' \
          '    {' \
          "      \"build_date\": \"${build_date}\"," \
          "      \"version\": \"${OTA_VERSION_KEY}\"," \
          "      \"sha256sum\": \"${sha256}\"," \
          "      \"url\": \"${OTA_DOWNLOAD_BASE}/${sysupgrade_name}\"" \
          '    }' \
          '  ]' \
          '}' \
          > release-bundle/fw.json

    - name: Upload release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: openwrt-v${{ env.OWRT_VERSION }}
        name: openwrt-v${{ env.OWRT_VERSION }}
        body_path: release.txt
        files: release-bundle/*
